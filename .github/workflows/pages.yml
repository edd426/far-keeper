name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build identity and diary manifest
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -la build-sha.txt build-sha.js diary/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='/previews' --exclude='/.git*' ./ "$RUNNER_TEMP/site/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  screenshot:
    needs: deploy
    runs-on: ubuntu-latest
    # 10, not 5: on 2026-08-04 a slow Ubuntu mirror ate the whole 5-minute
    # budget inside the Playwright install and the job was cancelled before
    # Chromium ever launched, so the Day 1 work commit has no preview and
    # never will. The install below no longer touches apt, so this ceiling is
    # now a backstop rather than the thing being raced. It is still bounded:
    # a hung job blocks the `concurrency: pages` group for at most 10 minutes.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.0-${{ runner.os }}

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.49.0
          # Deliberately NOT --with-deps. That flag apt-fetches ~21 MB of CJK,
          # Thai and Unifont font packages on every single run; on 2026-08-04
          # the mirror served 3.5 MB in 1m41s and the job died mid-download.
          # ubuntu-latest already carries Chromium's shared libraries and
          # DejaVu, which covers the box-drawing glyphs the tower scene uses.
          npx playwright install chromium
          # Don't take that on faith — prove Chromium actually launches on the
          # bare runner. Only if it doesn't do we pay for the system deps, so
          # the slow path costs nothing on the runs that don't need it.
          if ! node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "chromium did not launch bare; installing system deps"
            npx playwright install-deps chromium
          fi

      - name: Wait for Pages to settle
        run: sleep 25

      - name: Capture configured views
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p previews
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --manifest scripts/views.json \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Commit screenshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain previews/)" ]]; then
            DEPLOY_SHA="$(git rev-parse --short HEAD)"
            git add previews/
            git commit -m "ci: deploy preview for ${DEPLOY_SHA}" -m "[skip ci]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase && continue
            done
          else
            echo "no screenshot changes to commit"
          fi
